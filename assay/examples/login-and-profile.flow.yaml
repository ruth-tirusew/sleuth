# yaml-language-server: $schema=../schema/flow.schema.json
version: 1
name: login-and-profile
description: Log in, fetch the profile with the token, verify it.
nodes:
  - id: login
    kind: request
    request:
      method: POST
      url: "{{ .env.base_url }}/login"
      body:
        username: "{{ .env.username }}"
        password: "{{ .secrets.APP_PASSWORD }}"
      extract:
        token: body.token
        user_id: body.user_id

  - id: login_ok
    kind: assertion
    assert:
      - path: nodes.login.response.status
        equals: 200
      - path: nodes.login.out.token
        exists: true

  - id: auth_header
    kind: transform
    transform:
      set:
        value: "Bearer {{ .nodes.login.out.token }}"

  - id: profile
    kind: request
    needs: [login_ok]
    request:
      url: "{{ .env.base_url }}/users/{{ .nodes.login.out.user_id }}"
      headers:
        Authorization: "{{ .nodes.auth_header.out.value }}"
      extract:
        balance: body.balance

  - id: profile_ok
    kind: assertion
    assert:
      - path: nodes.profile.response.status
        equals: 200
      - path: nodes.profile.response.body.username
        equals: "{{ .env.username }}"
      - path: nodes.profile.out.balance
        gt: 0
        message: balance must be positive
