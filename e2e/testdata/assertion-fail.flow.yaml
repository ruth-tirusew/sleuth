version: 1
name: assertion-fail
nodes:
  - {id: health, kind: request, request: {url: "{{ .env.base_url }}/health"}}
  - id: expect_sick
    kind: assertion
    assert: [{path: nodes.health.response.body.status, equals: sick, message: deliberately wrong}]
  - {id: after, kind: transform, needs: [expect_sick], transform: {set: {x: 1}}}
