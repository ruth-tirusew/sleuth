version: 1
name: contract-violation
description: GET /legacy/{id} sends "total" as a string where the contract says number.
nodes:
  - id: legacy
    kind: request
    contract: api
    request: {url: "{{ .env.base_url }}/legacy/7"}
  - {id: after, kind: transform, needs: [legacy], transform: {set: {x: 1}}}
