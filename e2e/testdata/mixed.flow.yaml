version: 1
name: mixed
description: One assertion failure and one unreachable host in the same run; the assertion (exit 1) wins over infrastructure (exit 3).
nodes:
  - {id: health, kind: request, request: {url: "{{ .env.base_url }}/health"}}
  - id: wrong
    kind: assertion
    assert: [{path: nodes.health.response.status, equals: 500}]
  - {id: down, kind: request, request: {url: "http://127.0.0.1:1/x", timeout: 2s}}
