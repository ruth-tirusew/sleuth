version: 1
name: secret-derived
description: Template functions turn a secret into new strings (upper-cased, base64, joined); none of them may appear anywhere.
nodes:
  - id: call
    kind: request
    request:
      url: "http://127.0.0.1:1/x/{{ .secrets.API_TOKEN | upper | urlquery }}"
      headers:
        Authorization: "Basic {{ printf \"u:%s\" .secrets.API_TOKEN | b64enc }}"
      timeout: 2s
