version: 1
name: subflow
description: Logs in through a subflow, then uses what it returned.
nodes:
  - id: auth
    kind: flow
    flow: _login.flow.yaml
    params: {username: "{{ .env.username }}"}
  - id: profile
    kind: request
    request:
      url: "{{ .env.base_url }}/users/{{ .nodes.auth.out.user_id }}"
      headers: {Authorization: "Bearer {{ .nodes.auth.out.token }}"}
  - id: profile_ok
    kind: assertion
    assert:
      - {path: nodes.profile.response.status, equals: 200}
      - {path: nodes.profile.response.body.username, equals: "{{ .env.username }}"}
