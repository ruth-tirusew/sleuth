version: 1
name: secret-in-url
description: A secret with special characters goes into a URL that cannot be reached; it must not appear anywhere.
nodes:
  - id: call
    kind: request
    request:
      url: "http://127.0.0.1:1/x/{{ .secrets.API_TOKEN }}"
      query: {token: "{{ .secrets.API_TOKEN }}"}
      timeout: 2s
